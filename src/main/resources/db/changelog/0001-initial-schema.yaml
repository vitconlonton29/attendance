databaseChangeLog:
  - changeSet:
      id: 1
      author: system
      changes:
        - createTable:
            tableName: users
            columns:
              - column: {name: id, type: VARCHAR(36), constraints: {primaryKey: true, nullable: false}}
              - column: {name: username, type: VARCHAR(100), constraints: {unique: true, nullable: false}}
              - column: {name: display_name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: avatar_url, type: TEXT}
              - column: {name: lotus_points, type: BIGINT, constraints: {nullable: false, default: 0}}
              - column: {name: created_by, type: VARCHAR(36)}
              - column: {name: created_at, type: BIGINT}

        - createTable:
            tableName: attendance_records
            columns:
              - column: {name: id, type: VARCHAR(36), constraints: {primaryKey: true, nullable: false}}
              - column: {name: user_id, type: VARCHAR(36), constraints: {nullable: false}}
              - column: {name: attendance_date, type: DATE, constraints: {nullable: false}}
              - column: {name: points_earned, type: INTEGER, constraints: {nullable: false}}
              - column: {name: sequence_day, type: INTEGER, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(36)}
              - column: {name: created_at, type: BIGINT}

        # ... các bảng khác tương tự với VARCHAR(36) ID